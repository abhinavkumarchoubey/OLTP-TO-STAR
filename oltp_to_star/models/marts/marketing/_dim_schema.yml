version: 2
models:
  - name: dim_customer
    description: "This table contains customer information for marketing purposes."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        tests:
          - not_null
          - unique
      - name: customer_first_name
        description: "Customer's first name."
      - name: customer_last_name
        description: "Customer's last name."
      - name: customer_email
        description: "Customer's email address."
        tests:
          - not_null
          - unique
      - name: address_id
        description: "Foreign key to the address dimension."
        tests:
          - not_null
      - name: address_line1
        description: "Customer's address line 1."
      - name: address_line2
        description: "Customer's address line 2."
      - name: postal_code
        description: "Customer's postal code."
      - name: city_name
        description: "Customer's city."
      - name: country_name
        description: "Customer's country."
      - name: create_date
        description: "The date when the customer record was created."
        tests:
          - not_null
          
  - name: dim_film
    description: "This table contains film information for marketing purposes."
    columns:
      - name: film_id
        description: "Unique identifier for each film."
        tests:
          - not_null
          - unique
      - name: film_title
        description: "Title of the film."
        tests:
          - not_null
      - name: film_description
        description: "Description of the film."
      - name: film_release_year
        description: "Year the film was released."
      - name: rental_duration
        description: "Duration for which the film can be rented."
      - name: rental_rate
        description: "Rate at which the film can be rented."
      - name: film_length
        description: "Length of the film in minutes."
      - name: replacement_cost
        description: "Cost to replace the film."
      - name: film_rating
        description: "Rating of the film (e.g., G, PG, PG-13, R)."

  - name: dim_staff
    description: "This table contains staff information for marketing purposes."
    columns:
      - name: staff_id
        description: "Unique identifier for each staff member."
        tests:
          - not_null
          - unique
      - name: staff_first_name
        description: "Staff member's first name."
        tests:
          - not_null
      - name: staff_last_name
        description: "Staff member's last name."
        tests:
          - not_null
      - name: address_id
        description: "Foreign key to the address dimension."
        tests:
          - not_null
      - name: address_line1
        description: "Staff member's address line 1."
      - name: address_line2
        description: "Staff member's address line 2."
      - name: postal_code
        description: "Staff member's postal code."
      - name: city_name
        description: "Staff member's city."
      - name: country_name
        description: "Staff member's country."
      - name: staff_email
        description: "Staff member's email address."
        tests:
          - not_null
          - unique
      - name: store_id
        description: "Foreign key to the store dimension."
        tests:
          - not_null
      - name: active
        description: "Indicates whether the staff member is currently active."  
      - name: staff_username
        description: "Username for the staff member."

  - name: dim_store
    description: "This table contains store information for marketing purposes."
    columns:
      - name: store_id
        description: "Unique identifier for each store."
        tests:
          - not_null
          - unique
      - name: manager_staff_id
        description: "Foreign key to the staff dimension representing the store manager."
        tests:
          - not_null
      - name: address_id
        description: "Foreign key to the address dimension."
        tests:
          - not_null
      - name: address_line1
        description: "Store's address line 1."
      - name: address_line2
        description: "Store's address line 2."
      - name: postal_code
        description: "Store's postal code."
      - name: city_name
        description: "Store's city."
      - name: country_name
        description: "Store's country."
      - name: manager_name
        description: "Full name of the store manager."